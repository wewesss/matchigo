name: Publish to npm

# Two ways in:
# - Actions tab → "Publish to npm" → Run workflow, type the version: bumps package.json on
#   main if needed, tags, publishes, then creates the GitHub release.
# - Publishing a GitHub release by hand: publishes the tagged commit as is.
# The release created by the first path uses GITHUB_TOKEN, which never triggers the second.
#
# npm trusted publishing matches this file name and the `npm` environment: renaming either
# breaks the publish until the trusted publisher on npmjs.com is updated.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (e.g. 1.0.3)"
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Reject dispatch outside main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION#v}"
          else
            V="${GITHUB_REF#refs/tags/}"
            V="${V#v}"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$V' is not a semver version."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$V" ]; then
            echo "::error::Release tag 'v$V' does not match package.json version '$PKG'. Bump package.json or retag the release."
            exit 1
          fi

      - name: Reject a version already on npm
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if npm view "matchigo@$V" version >/dev/null 2>&1; then
            echo "::error::matchigo@$V is already on npm."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bun run format:check

      - name: Type-check
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$V" --no-git-tag-version --allow-same-version
          if ! git diff --quiet package.json; then
            git commit -am "chore(release): v$V"
            git push origin HEAD:main
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            git tag "v$V"
            git push origin "v$V"
          fi

      - name: Build
        run: bun run build

      # No token: npm exchanges this run's OIDC token with the trusted publisher registered
      # on npmjs.com and attests provenance on its own. Verbose because a refused OIDC
      # exchange is only explained at that level.
      - name: Publish to npm
        run: npm publish --access public --loglevel verbose

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag
          fi
